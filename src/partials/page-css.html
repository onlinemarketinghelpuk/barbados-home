<style>
/* ================= inner pages (About, Team): shared parts. Built on the home page's tokens and components. ================= */
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
/* page hero: the home hero, shorter, with one photo and no slide controls */
.ph{min-height:72vh;min-height:72svh}
.ph .crumbs{margin-bottom:26px}
.ph .crumbs ol{display:flex;flex-wrap:wrap;gap:10px;margin:0;padding:0;list-style:none}
.ph .crumbs li{font:500 12.5px/1.5 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ph .crumbs li+li::before{content:"/";margin-right:10px;opacity:.5}
.ph .crumbs a{color:var(--mint)}.ph .crumbs a:hover{text-decoration:underline;text-underline-offset:3px}
.ph .foot{grid-template-columns:minmax(0,1fr) auto}

/* team cards: portrait on a white panel (the photos have white backgrounds), role as a gold mono label, then the name */
.tgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}
.tm{display:flex;flex-direction:column;height:100%;margin:0;border:1px solid var(--line);border-radius:2px;background:var(--card);overflow:hidden;transition:border-color .25s,transform .25s}
.tm:hover{border-color:color-mix(in srgb,var(--teal) 55%,transparent);transform:translateY(-3px)}
.tm .pic{aspect-ratio:1/1;background:#F4F5F7;overflow:hidden}
.tm .pic img{width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease)}
.tm:hover .pic img{transform:scale(1.04)}
.tm figcaption{display:flex;flex-direction:column;gap:8px;padding:18px 18px 20px;border-top:3px solid var(--gold)}
.tm .tag{color:var(--teal)}
.tm b{font-size:17px;font-weight:700;line-height:1.35}
@media (max-width:1100px){.tgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){.tgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tm figcaption{padding:14px 12px 16px}.tm b{font-size:15px}}
@media (max-width:360px){.tgrid{grid-template-columns:1fr}}
</style>
